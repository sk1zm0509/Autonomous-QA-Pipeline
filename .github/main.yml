name: Autonomous Quality Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 08 * * *' # Runs daily at 8:30 AM
  workflow_dispatch:      # Allows manual trigger for interviews

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Automated Tests
        working-directory: ./automation-suite
        run: mvn test
       
