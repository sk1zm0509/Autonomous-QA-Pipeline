name: Autonomous Quality Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 08 * * *' # Runs daily at 8:30 AM
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Automated Tests
        run: mvn test
